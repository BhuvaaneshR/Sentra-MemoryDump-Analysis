<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentra | Secure Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h2>Sentra</h2>
            <p>Memory Forensics Platform - Sign In</p>
        </div>

        <div id="error-message" class="error-msg" style="display: none;"></div>

        <form id="loginForm" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required 
                       autocomplete="email" placeholder="analyst@agency.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required 
                           autocomplete="current-password" placeholder="••••••••">
                    
                    <span class="toggle-password" onclick="togglePassword('password')">
                        <svg id="eye-icon-password" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label for="otp">Verification Code</label>
                <div class="otp-group" style="display: flex; gap: 10px;">
                    <input type="text" id="otp" name="otp" placeholder="6-digit code" maxlength="6" 
                           style="flex: 1; text-align: center; letter-spacing: 3px; font-weight: bold;" required>
                    
                    <button type="button" id="get-code-btn" class="btn-secondary" style="width: auto; padding: 0 15px; white-space: nowrap; border: 1px solid var(--primary-color); background: transparent; color: var(--primary-color); cursor: pointer; border-radius: 4px;">
                        Get Code
                    </button>
                </div>
                <small id="otp-msg" style="display: none; margin-top: 5px; font-size: 0.8rem; color: #00ff88;"></small>
            </div>

            <button type="submit" id="login-btn" class="btn-primary">SIGN IN</button>
        </form>

        <div class="google-btn-container" style="margin-top: 20px;">
            <div id="g_id_onload"
                 data-client_id="199455383424-iai5kpl9402j9btrgl70uj0rer5f8quu.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin" 
                 data-type="standard" 
                 data-shape="rectangular"
                 data-theme="filled_black"
                 data-text="sign_in_with"
                 data-size="large"
                 data-logo_alignment="left"
                 data-width="310">
            </div>
        </div>

        <div class="auth-footer">
            <p>Don't have access? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    
    <script>
        function togglePassword(fieldId) {
            const input = document.getElementById(fieldId);
            const icon = document.getElementById('eye-icon-' + fieldId);
            if (input.type === "password") {
                input.type = "text";
                icon.style.opacity = "0.5";
            } else {
                input.type = "password";
                icon.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
