<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentra | Case History</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="print-header" class="print-only">
        <div class="print-logo">
            <h2>SENTRA</h2>
            <span>Memory Forensics Report</span>
        </div>
        <div class="print-meta">
            <p>Generated: <span id="print-date"></span></p>
            <p>Analyst: <span id="print-analyst"></span></p>
        </div>
        <hr>
    </div>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-area"><h2>SENTRA</h2><span class="version">v1.0.0</span></div>
            <nav class="nav-links">
                <a href="home.html"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
                <a href="upload.html"><i class="fa-solid fa-upload"></i> New Investigation</a>
                <a href="history.html" class="active"><i class="fa-solid fa-clock-rotate-left"></i> Case History</a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            <div class="user-profile">
                <div class="avatar"><i class="fa-solid fa-user-secret"></i></div>
                <div class="user-info"><span id="analyst-name">Analyst</span></div>
                <button id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>Case History</h1>
                <div class="filter-bar">
                    <input type="text" id="search-input" placeholder="Search Case ID..." class="search-input">
                    
                    <button class="btn-secondary" id="print-btn" title="Print Report">
                        <i class="fa-solid fa-print"></i> Print
                    </button>

                    <button class="btn-primary" id="refresh-btn">
                        <i class="fa-solid fa-rotate-right"></i> Refresh
                    </button>
                </div>
            </header>

            <div class="table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Case ID</th>
                            <th>Filename</th>
                            <th>Date Uploaded</th>
                            <th>Size</th>
                            <th>Status</th>
                            <th>Mode</th>
                            <th>Threat Score</th>
                            <th class="no-print">Actions</th> </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr><td colspan="8" style="text-align: center; padding: 20px;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="delete-modal" class="modal hidden">
        <div class="modal-content">
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: #ff7b72; margin-bottom: 20px;"></i>
            <h3>Confirm Deletion</h3>
            <p style="color: #8b949e; margin-bottom: 20px;">Verification code sent to email.</p>
            <div class="form-group" style="display: flex; justify-content: center; margin-bottom: 20px;">
                <input type="text" id="delete-otp-input" placeholder="6-digit Code" maxlength="6" 
                       style="text-align: center; letter-spacing: 4px; padding: 10px; border-radius: 6px;">
            </div>
            <div class="modal-actions">
                <button id="cancel-delete-btn" class="btn-secondary">Cancel</button>
                <button id="confirm-delete-btn" class="btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
    <script src="js/history.js"></script> 
</body>
</html>
