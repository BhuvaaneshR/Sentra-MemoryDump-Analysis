<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentra | Case History</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-area"><h2>SENTRA</h2><span class="version">v1.0.0</span></div>
            <nav class="nav-links">
                <a href="home.html"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
                <a href="upload.html"><i class="fa-solid fa-upload"></i> New Investigation</a>
                <a href="history.html" class="active"><i class="fa-solid fa-clock-rotate-left"></i> Case History</a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            <div class="user-profile">
                <div class="avatar"><i class="fa-solid fa-user-secret"></i></div>
                <div class="user-info"><span id="analyst-name">Analyst</span></div>
                <button id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>Case History</h1>
                <div class="filter-bar">
                    <input type="text" id="search-input" placeholder="Search Case ID or Filename..." class="search-input">
                    
                    <button class="btn-primary" id="refresh-btn" style="width: auto; padding: 8px 15px; margin-left: 10px;">
                        <i class="fa-solid fa-rotate-right"></i> Refresh
                    </button>
                </div>
            </header>

            <div class="table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Case ID</th>
                            <th>Filename</th>
                            <th>Date Uploaded</th>
                            <th>Size</th>
                            <th>Status</th>
                            <th>Mode</th> <th>Threat Score</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 20px; color: #8b949e;">
                                Loading cases...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
    <script src="js/history.js"></script> 
</body>
</html>
