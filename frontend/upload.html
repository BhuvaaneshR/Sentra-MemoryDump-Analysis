<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentra | New Investigation</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-area">
                <h2>SENTRA</h2>
                <span class="version">v1.0.0</span>
            </div>
            <nav class="nav-links">
                <a href="home.html"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
                <a href="upload.html" class="active"><i class="fa-solid fa-upload"></i> New Investigation</a>
                <a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> Case History</a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            <div class="user-profile">
                <div class="avatar"><i class="fa-solid fa-user-secret"></i></div>
                <div class="user-info"><span id="analyst-name">Analyst</span></div>
                <button id="logout-btn" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>New Investigation</h1>
                <div class="status-badge">
                    <span class="status-dot" style="background:#00ff88;"></span>System Ready
                </div>
            </header>

            <div class="upload-container">
                <div id="drop-zone" class="drop-zone">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <h3>Drag & Drop Memory Dump</h3>
                    <p>Supported: .raw, .mem, .vmem, .img (Max: 16GB)</p>
                    <input type="file" id="file-input" hidden accept=".raw,.mem,.vmem,.img">
                    <button class="btn-primary" onclick="document.getElementById('file-input').click()" style="width: auto;">
                        Browse Files
                    </button>
                </div>

                <div id="file-preview" class="file-preview hidden">
                    <div class="file-icon"><i class="fa-solid fa-file-binary"></i></div>
                    <div class="file-details">
                        <span id="file-name">filename.mem</span>
                        <small id="file-size">0 MB</small>
                    </div>
                    <i id="remove-file" class="fa-solid fa-xmark remove-btn" title="Remove File"></i>
                </div>

                <div id="progress-container" class="hidden" style="margin-top: 25px; text-align: left;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px; color:var(--text-muted); font-size:0.85rem;">
                        <span><i class="fa-solid fa-shield-halved"></i> Uploading to Secure Sandbox...</span>
                        <span id="progress-text">0%</span>
                    </div>
                    <div style="width: 100%; background: var(--border-color); height: 10px; border-radius: 5px; overflow: hidden;">
                        <div id="progress-bar" style="width: 0%; height: 100%; background: var(--primary-color); transition: width 0.2s ease;"></div>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 30px;">
                    <button id="start-analysis-btn" class="btn-primary" disabled style="max-width: 300px;">
                        <i class="fa-solid fa-microchip"></i> UPLOAD & ANALYZE
                    </button>
                </div>

                <div id="upload-error" class="error-msg" style="margin-top: 20px;"></div>
                <div id="upload-success" class="success-msg" style="margin-top: 20px;"></div>
            </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script> 
    <script src="js/upload.js"></script>    
</body>
</html>
